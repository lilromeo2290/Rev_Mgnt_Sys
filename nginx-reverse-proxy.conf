# ==========================================================
#  Nginx Reverse Proxy Config for Consult RMS
#  
#  Use this to map a domain or subdomain to port 3000
#  so you can access via http://yourdomain.com instead of :3000
#  
#  Place in:  /etc/nginx/conf.d/consult-rms.conf
#  Then:     sudo nginx -t && sudo systemctl reload nginx
# ==========================================================

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;   # <-- CHANGE THIS

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
