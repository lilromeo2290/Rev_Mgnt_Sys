# ==========================================================
#  Nginx Reverse Proxy Config for Consult RMS
#  
#  Webuzo VPS — Place in:
#    /usr/local/apps/nginx/etc/conf.d/consult-rms.conf
#  Then:  /usr/local/apps/nginx/sbin/nginx -t && 
#         /usr/local/apps/nginx/sbin/nginx -s reload
# ==========================================================

server {
    listen 80;
    server_name rms.clipeconsult.com;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
